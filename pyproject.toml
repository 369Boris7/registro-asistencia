[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "RUF",
]
extend-ignore = [
    "EXE001",
]

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["EXE001"]
"asistencias/tests.py" = ["S101"]
"tests/*.py" = ["S101"]